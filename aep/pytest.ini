[pytest]
# --ds is load-bearing, not redundant with DJANGO_SETTINGS_MODULE below.
# UV_ENV_FILE=.env puts DJANGO_SETTINGS_MODULE=config.settings.development into
# the real environment, and pytest-django precedence is --ds > env var > ini.
# Without --ds the suite would silently run against development settings.
DJANGO_SETTINGS_MODULE = config.settings.testing
addopts = --ds=config.settings.testing --reuse-db -q
python_files = test_*.py
testpaths = tests
